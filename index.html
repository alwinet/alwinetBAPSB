<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alwinet BAPSB</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152e, #123f70);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      max-width: 650px;
      width: 100%;
      padding: 40px 25px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
    }
    .logo { font-size: 54px; }
    h1 { color: #5eead4; }
    p { color: #dbeafe; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 13px 24px;
      border-radius: 10px;
      color: #07152e;
      background: #5eead4;
      text-decoration: none;
      font-weight: bold;
    }
    footer { margin-top: 30px; font-size: 12px; color: #bfdbfe; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🌐</div>
    <h1>ALWINET BAPSB</h1>
    <p>Selamat datang di website resmi kami.</p>
    <p>Website ini dibuat dengan hosting gratis dan bisa diakses melalui internet.</p>
    <a href="https://github.com/alwinet">Kunjungi GitHub</a>
    <footer>© 2026 Alwinet BAPSB</footer>
  </main>
</body>
</html>
